{{define "todoList"}}
<div id="todo-list">
{{- if .Todos}}
{{- range .Todos}}
<div class="todo-item{{if .Completed}} done{{end}}" id="todo-{{.ID}}">
  <input type="checkbox"{{if .Completed}} checked{{end}}
         nonce="{{$.Nonce}}"
         data-on:change="@put('/api/todos/{{.ID}}')">
  <span class="todo-text">{{.Text}}</span>
  <button class="del-btn" nonce="{{$.Nonce}}" data-on:click="@delete('/api/todos/{{.ID}}')">&#215;</button>
</div>
{{- end}}
{{- else}}
<p class="empty">No todos yet — add one above!</p>
{{- end}}
</div>
{{end}}
